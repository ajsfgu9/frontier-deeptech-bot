services:
  frontier-deeptech-bot:
    build: .
    image: frontier-deeptech-bot:latest
    container_name: frontier-deeptech-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot-data:/app/data # SQLite DB + heartbeat file survive rebuilds/restarts
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
